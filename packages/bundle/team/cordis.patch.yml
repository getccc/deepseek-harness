# The dsh-team bundle patch: the Team Edition surface over the dsh-web-app
# layer. Applied after dsh-base and dsh-web-app, so rows here override those
# by id, with the profile's own cordis.patch.yml and any --patch overlays
# still to come.
#
# A patch replaces the targeted row's whole `config`, so each row below
# restates every key it owns. `inject` and `name` stay with the row the
# earlier layer inserted.
#
# This layer owns the loopback port, the team account this computer holds, the
# three local addresses a browser navigates to, and how company model and
# knowledge requests leave this computer.

# ── the Team Runner's loopback address ─────────────────────────────────────

# A Team Runner is a long-lived background service, while `dsh web` is a
# foreground tool a developer starts by hand. Both are ordinary loopback
# servers, so they cannot share a port: the second one to bind fails. Team
# therefore defaults to 3090 and leaves 3080 to `dsh web`, letting a
# developer run both without editing configuration.
#
# `--port` still wins over this default, and the port stays fixed rather than
# scanned: a company entry point navigates the browser to a known address, so
# a silently relocated Runner would be unreachable instead of merely absent.
- id: webserver
  config:
    host: !!js ctx.webStartup.host ?? '127.0.0.1'
    port: !!js ctx.webStartup.port ?? 3090
    compression: gzip
    compressionLevel: 1
    compressionThresholdBytes: 1024

# Team opens a clean local entry. The local login owns authentication, so this
# URL must not carry the process-token shortcut used by the standalone Web app.
- id: web-runtime
  config:
    openBrowser: !!js ctx.webStartup.openBrowser
    printUrl: true
    entryPath: /team/open
    surfaceContext: true
    trustedHosts: !!js ctx.webStartup.trustedHosts

# Company models use a distinct provider route from a member's own DeepSeek
# configuration. The model ref remains the deployment default, while the Team
# transport supplies its catalog and invocation path.
- id: agent-default-model
  config:
    provider: built-in
    model: deepseek-v4-flash

# The base adapter keeps its direct DeepSeek route and adds the company route
# only after the Team transport is mounted.
- id: llm-deepseek
  inject: [llmHttpTransport]

# ── the team account this computer holds ───────────────────────────────────

# `controlPlaneUrl` and `runnerVersion` are deliberately absent, and the row
# fails to load without them. A Runner that guessed which company it belongs to
# would send a public key to a stranger, and one that reported a version it
# invented would put a wrong fact in front of the administrator reading the
# device list. An installer knows both and writes them into its own patch.
#
# `callbackUri` restates the loopback port above. It has to be a literal the
# Control Plane can be told in advance, because it is bound into every
# authorization code and compared on redemption.
- insert:
    - id: team-account-client
      name: '@deepseek-ai/dsh-team-account-client'
      config:
        callbackUri: !!js "'http://127.0.0.1:' + (ctx.webStartup.port ?? 3090) + '/team/callback'"
        refreshLeadMs: 60000

    # Account authentication stays on the Runner origin. Ordinary members do
    # not navigate to the Control Plane administration origin.
    - id: team-local-login
      name: '@deepseek-ai/dsh-team-local-login'
      config:
        applicationPath: /
        maxRequestBodyBytes: 16384
        locale: en-US

    # How a company model request leaves this computer. It carries an
    # operation, a model ref, and a body — no address and no credential,
    # because the request has no place for either.
    #
    # `controlPlaneUrl` is absent here for the same reason it is absent above:
    # a Runner that guessed which company it belongs to would send a request to
    # a stranger.
    - id: llm-http-transport
      name: '@deepseek-ai/dsh-llm-http-transport-team'

    # How a private knowledge request leaves this computer. It carries a query
    # and the references this Session's scope resolved to — no knowledge
    # address, credential, tenant, or upstream id, because the protocol has no
    # place for one.
    #
    # `controlPlaneUrl` is absent for the same reason it is absent above: a
    # Runner that guessed which company it belongs to would ask a stranger what
    # its member may read.
    - id: knowledge
      name: '@deepseek-ai/dsh-knowledge-team'

    # What a model sees of it: one search tool and one prompt section, both
    # folded from the Session log, and neither present while the member has
    # chosen no knowledge for this conversation.
    - id: tool-knowledge
      name: '@deepseek-ai/dsh-tool-knowledge'
      config:
        maxResults: 10
        timeoutMs: 60000
