<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540">
  <style>
    text { font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif; }
  </style>

  <!-- 顶部主题横条 -->
  <rect x="0" y="0" width="960" height="8" fill="#4472C4"/>

  <!-- 右侧装饰圆 -->
  <circle cx="830" cy="120" r="140" fill="#DEEBF7"/>
  <circle cx="740" cy="262" r="60" fill="#FFE699"/>

  <!-- kicker -->
  <text x="80" y="148" font-size="13" font-weight="700" fill="#4472C4">MONTHLY EXPENSE REPORT · AUGUST 2026</text>

  <!-- 标题 -->
  <text x="80" y="206" font-size="44" font-weight="700" fill="#1F4E79">2026年8月支出报告</text>
  <rect x="84" y="232" width="72" height="6" rx="3" fill="#ED7D31"/>

  <!-- 副题 -->
  <text x="80" y="278" font-size="16" fill="#595959">统计期间 2026-08-01 至 2026-08-28 · 记录 10 笔 · 覆盖 6 个支出分类</text>

  <!-- 三张统计卡 -->
  <g>
    <rect x="80" y="396" width="250" height="104" rx="8" fill="#F7F9FC" stroke="#D9E2F3"/>
    <text x="100" y="426" font-size="12" fill="#808080">总支出</text>
    <text x="100" y="470" font-size="30" font-weight="700" fill="#1F4E79">¥1,131.80</text>
  </g>
  <g>
    <rect x="354" y="396" width="250" height="104" rx="8" fill="#F7F9FC" stroke="#D9E2F3"/>
    <text x="374" y="426" font-size="12" fill="#808080">记录笔数</text>
    <text x="374" y="470" font-size="30" font-weight="700" fill="#1F4E79">10 笔</text>
  </g>
  <g>
    <rect x="628" y="396" width="250" height="104" rx="8" fill="#F7F9FC" stroke="#D9E2F3"/>
    <text x="648" y="426" font-size="12" fill="#808080">日均支出（28 天口径）</text>
    <text x="648" y="470" font-size="30" font-weight="700" fill="#1F4E79">¥40.4</text>
  </g>

  <!-- 页脚 -->
  <text x="80" y="524" font-size="9" fill="#808080">数据来源：《月度支出表》与《月度支出报告》</text>
</svg>
