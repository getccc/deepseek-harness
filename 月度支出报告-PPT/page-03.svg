<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540">
  <style>
    text { font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif; }
  </style>

  <!-- 标题区 -->
  <text x="80" y="56" font-size="26" font-weight="700" fill="#1F4E79">支出明细</text>
  <rect x="84" y="66" width="54" height="5" rx="2.5" fill="#ED7D31"/>
  <text x="880" y="56" font-size="12" fill="#808080" text-anchor="end">金额单位：人民币元</text>

  <!-- 表头 -->
  <rect x="80" y="118" width="800" height="40" fill="#4472C4"/>
  <text x="160" y="144" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">日期</text>
  <text x="252" y="144" font-size="13" font-weight="700" fill="#FFFFFF">分类</text>
  <text x="852" y="144" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="end">金额（元）</text>

  <!-- 数据行 -->
  <g font-size="13" fill="#333333">
    <!-- 行 1 -->
    <rect x="80" y="158" width="800" height="31" fill="#F7F9FC"/>
    <text x="160" y="180" text-anchor="middle">2026-08-01</text>
    <text x="252" y="180">餐饮</text>
    <text x="852" y="180" text-anchor="end">¥86.50</text>
    <!-- 行 2 -->
    <text x="160" y="211" text-anchor="middle">2026-08-02</text>
    <text x="252" y="211">交通</text>
    <text x="852" y="211" text-anchor="end">¥35.00</text>
    <!-- 行 3 -->
    <rect x="80" y="220" width="800" height="31" fill="#F7F9FC"/>
    <text x="160" y="242" text-anchor="middle">2026-08-05</text>
    <text x="252" y="242">购物</text>
    <text x="852" y="242" text-anchor="end">¥259.00</text>
    <!-- 行 4 -->
    <text x="160" y="273" text-anchor="middle">2026-08-08</text>
    <text x="252" y="273">餐饮</text>
    <text x="852" y="273" text-anchor="end">¥68.00</text>
    <!-- 行 5 -->
    <rect x="80" y="282" width="800" height="31" fill="#F7F9FC"/>
    <text x="160" y="304" text-anchor="middle">2026-08-10</text>
    <text x="252" y="304">娱乐</text>
    <text x="852" y="304" text-anchor="end">¥88.00</text>
    <!-- 行 6 -->
    <text x="160" y="335" text-anchor="middle">2026-08-15</text>
    <text x="252" y="335">水电燃气</text>
    <text x="852" y="335" text-anchor="end">¥156.40</text>
    <!-- 行 7 -->
    <rect x="80" y="344" width="800" height="31" fill="#F7F9FC"/>
    <text x="160" y="366" text-anchor="middle">2026-08-18</text>
    <text x="252" y="366">交通</text>
    <text x="852" y="366" text-anchor="end">¥42.00</text>
    <!-- 行 8 -->
    <text x="160" y="397" text-anchor="middle">2026-08-22</text>
    <text x="252" y="397">餐饮</text>
    <text x="852" y="397" text-anchor="end">¥122.00</text>
    <!-- 行 9 -->
    <rect x="80" y="406" width="800" height="31" fill="#F7F9FC"/>
    <text x="160" y="428" text-anchor="middle">2026-08-25</text>
    <text x="252" y="428">医疗</text>
    <text x="852" y="428" text-anchor="end">¥75.00</text>
    <!-- 行 10 -->
    <text x="160" y="459" text-anchor="middle">2026-08-28</text>
    <text x="252" y="459">购物</text>
    <text x="852" y="459" text-anchor="end">¥199.90</text>
  </g>

  <!-- 合计行 -->
  <rect x="80" y="468" width="800" height="40" fill="#FFF2CC"/>
  <rect x="80" y="468" width="800" height="2" fill="#1F4E79"/>
  <text x="160" y="493" font-size="13" font-weight="700" fill="#1F4E79" text-anchor="middle">合计</text>
  <text x="852" y="493" font-size="13" font-weight="700" fill="#1F4E79" text-anchor="end">¥1,131.80</text>

  <!-- 页脚 -->
  <rect x="80" y="516" width="800" height="1" fill="#D9E2F3"/>
  <text x="80" y="530" font-size="9" fill="#808080">2026年8月支出报告 · 数据源自《月度支出表》</text>
  <text x="880" y="530" font-size="9" fill="#808080" text-anchor="end">3 / 5</text>
</svg>
