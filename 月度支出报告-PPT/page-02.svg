<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540">
  <style>
    text { font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif; }
  </style>

  <!-- 标题区 -->
  <text x="80" y="56" font-size="26" font-weight="700" fill="#1F4E79">支出总览</text>
  <rect x="84" y="66" width="54" height="5" rx="2.5" fill="#ED7D31"/>
  <text x="880" y="56" font-size="12" fill="#808080" text-anchor="end">金额单位：人民币元</text>

  <!-- KPI 卡 1 -->
  <g>
    <rect x="80" y="120" width="388" height="168" rx="10" fill="#F7F9FC" stroke="#D9E2F3"/>
    <text x="108" y="156" font-size="12" fill="#808080">2026年8月总支出</text>
    <text x="108" y="224" font-size="30" font-weight="700" fill="#1F4E79">¥1,131.80</text>
  </g>

  <!-- KPI 卡 2 -->
  <g>
    <rect x="492" y="120" width="388" height="168" rx="10" fill="#F7F9FC" stroke="#D9E2F3"/>
    <text x="520" y="156" font-size="12" fill="#808080">记录笔数</text>
    <text x="520" y="224" font-size="30" font-weight="700" fill="#1F4E79">10 笔</text>
    <text x="520" y="260" font-size="12" fill="#595959">单笔平均 ¥113.18</text>
  </g>

  <!-- KPI 卡 3 -->
  <g>
    <rect x="80" y="308" width="388" height="168" rx="10" fill="#F7F9FC" stroke="#D9E2F3"/>
    <text x="108" y="344" font-size="12" fill="#808080">日均支出</text>
    <text x="108" y="412" font-size="30" font-weight="700" fill="#1F4E79">¥40.4</text>
    <text x="108" y="448" font-size="12" fill="#595959">按 28 天统计口径</text>
  </g>

  <!-- KPI 卡 4 -->
  <g>
    <rect x="492" y="308" width="388" height="168" rx="10" fill="#F7F9FC" stroke="#D9E2F3"/>
    <text x="520" y="344" font-size="12" fill="#808080">最大支出分类</text>
    <text x="520" y="412" font-size="30" font-weight="700" fill="#ED7D31">购物</text>
    <text x="520" y="448" font-size="12" fill="#595959">¥458.90 · 占比 40.5%</text>
  </g>

  <!-- 页脚 -->
  <rect x="80" y="516" width="800" height="1" fill="#D9E2F3"/>
  <text x="80" y="530" font-size="9" fill="#808080">2026年8月支出报告 · 数据源自《月度支出表》</text>
  <text x="880" y="530" font-size="9" fill="#808080" text-anchor="end">2 / 5</text>
</svg>
