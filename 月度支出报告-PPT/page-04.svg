<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540">
  <style>
    text { font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif; }
  </style>

  <!-- 标题区 -->
  <text x="80" y="56" font-size="26" font-weight="700" fill="#1F4E79">分类支出占比</text>
  <rect x="84" y="66" width="54" height="5" rx="2.5" fill="#ED7D31"/>
  <text x="880" y="56" font-size="12" fill="#808080" text-anchor="end">合计 ¥1,131.80</text>

  <!-- 行 1：购物 -->
  <rect x="88" y="136" width="14" height="14" rx="3" fill="#ED7D31"/>
  <text x="112" y="156" font-size="14" font-weight="700" fill="#333333">购物</text>
  <text x="112" y="176" font-size="11" fill="#808080">¥458.90</text>
  <rect x="330" y="145" width="520" height="22" rx="11" fill="#F1F5FB"/>
  <rect x="330" y="145" width="520" height="22" rx="11" fill="#ED7D31"/>
  <text x="862" y="175" font-size="12" font-weight="700" fill="#1F4E79">40.5%</text>

  <!-- 行 2：餐饮 -->
  <rect x="88" y="192" width="14" height="14" rx="3" fill="#FFC000"/>
  <text x="112" y="212" font-size="14" font-weight="700" fill="#333333">餐饮</text>
  <text x="112" y="232" font-size="11" fill="#808080">¥276.50</text>
  <rect x="330" y="201" width="520" height="22" rx="11" fill="#F1F5FB"/>
  <rect x="330" y="201" width="313" height="22" rx="11" fill="#FFC000"/>
  <text x="655" y="231" font-size="12" font-weight="700" fill="#1F4E79">24.4%</text>

  <!-- 行 3：水电燃气 -->
  <rect x="88" y="248" width="14" height="14" rx="3" fill="#4472C4"/>
  <text x="112" y="268" font-size="14" font-weight="700" fill="#333333">水电燃气</text>
  <text x="112" y="288" font-size="11" fill="#808080">¥156.40</text>
  <rect x="330" y="257" width="520" height="22" rx="11" fill="#F1F5FB"/>
  <rect x="330" y="257" width="177" height="22" rx="11" fill="#4472C4"/>
  <text x="519" y="287" font-size="12" font-weight="700" fill="#1F4E79">13.8%</text>

  <!-- 行 4：娱乐 -->
  <rect x="88" y="304" width="14" height="14" rx="3" fill="#70AD47"/>
  <text x="112" y="324" font-size="14" font-weight="700" fill="#333333">娱乐</text>
  <text x="112" y="344" font-size="11" fill="#808080">¥88.00</text>
  <rect x="330" y="313" width="520" height="22" rx="11" fill="#F1F5FB"/>
  <rect x="330" y="313" width="100" height="22" rx="11" fill="#70AD47"/>
  <text x="442" y="343" font-size="12" font-weight="700" fill="#1F4E79">7.8%</text>

  <!-- 行 5：交通 -->
  <rect x="88" y="360" width="14" height="14" rx="3" fill="#5B9BD5"/>
  <text x="112" y="380" font-size="14" font-weight="700" fill="#333333">交通</text>
  <text x="112" y="400" font-size="11" fill="#808080">¥77.00</text>
  <rect x="330" y="369" width="520" height="22" rx="11" fill="#F1F5FB"/>
  <rect x="330" y="369" width="87" height="22" rx="11" fill="#5B9BD5"/>
