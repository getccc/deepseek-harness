  <rect x="88" y="416" width="14" height="14" rx="3" fill="#C0392B"/>
  <text x="112" y="436" font-size="14" font-weight="700" fill="#333333">医疗</text>
  <text x="112" y="456" font-size="11" fill="#808080">¥75.00</text>
  <rect x="330" y="425" width="520" height="22" rx="11" fill="#F1F5FB"/>
