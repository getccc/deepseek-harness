  <!-- 说明 -->
  <text x="80" y="482" font-size="11" fill="#808080">占比 = 分类金额 ÷ 合计金额（¥1,131.80），四舍五入到 0.1 个百分点</text>

  <!-- 页脚 -->
  <rect x="80" y="516" width="800" height="1" fill="#D9E2F3"/>
  <text x="80" y="530" font-size="9" fill="#808080">2026年8月支出报告 · 数据源自《月度支出表》</text>
  <text x="880" y="530" font-size="9" fill="#808080" text-anchor="end">4 / 5</text>
